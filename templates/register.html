<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SocialConnect - Register</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root { --ink: #09070e; --panel: #12101b; --line: rgba(255,255,255,.1); --text: #f5f2ff; --muted: #9690a8; --violet: #a855f7; --electric: #d946ef; --lime: #b7ff3c; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            background: var(--ink);
            background-image: radial-gradient(circle at 15% 20%, rgba(168,85,247,.2), transparent 24rem), radial-gradient(circle at 85% 80%, rgba(217,70,239,.15), transparent 24rem);
        }

        .register-container {
            position: relative;
            width: 430px;
            max-width: 100%;
            background: rgba(18,16,27,.9);
            border: 1px solid var(--line);
            padding: 36px 38px 30px;
            border-radius: 6px;
            box-shadow: 0 25px 80px rgba(0,0,0,.45), 0 0 42px rgba(168,85,247,.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: var(--text);
            font-size: 30px;
            letter-spacing: -1.5px;
        }

        .logo h1::before { content: '◈'; color: var(--electric); margin-right: 9px; }

        .logo p {
            color: var(--muted);
            margin-top: 5px;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font: 11px 'DM Mono', monospace;
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 3px;
            background: #0c0a12;
            color: var(--text);
            font: 13px 'Space Grotesk', sans-serif;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--violet);
            box-shadow: 0 0 16px rgba(168,85,247,.2);
        }

        .input-group input::placeholder { color: #686174; }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 3px;
            background: var(--violet);
            color: white;
            font: 600 13px 'Space Grotesk', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(168,85,247,.3);
        }

        .register-btn:hover {
            background: var(--electric);
            box-shadow: 0 0 26px rgba(217,70,239,.45);
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 13px;
        }

        .login a {
            color: var(--lime);
            font-weight: bold;
            text-decoration: none;
        }

        .register-container::before, .register-container::after { content: ''; position: absolute; pointer-events: none; border: 1px solid rgba(217,70,239,.5); }
        .register-container::before { width: 90px; height: 90px; border-radius: 50%; bottom: -45px; left: -45px; box-shadow: 0 0 30px rgba(217,70,239,.3); }
        .register-container::after { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); border: 0; right: 25px; top: 25px; box-shadow: 0 0 15px var(--lime); }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            <h1>SocialConnect</h1>
            <p>Create your account</p>
        </div>

        <form action="/register" method="POST">

            <div class="input-group">
                <label for="fullname">Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirm_password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <div class="login">
            <p>
                Already have an account?
                <a href="/login">Login</a>
            </p>
        </div>

    </div>

</body>
</html>
