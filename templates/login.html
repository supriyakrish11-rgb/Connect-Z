<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        :root { --ink: #09070e; --panel: #12101b; --line: rgba(255,255,255,.1); --text: #f5f2ff; --muted: #9690a8; --violet: #a855f7; --electric: #d946ef; --lime: #b7ff3c; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            background: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            background-image: radial-gradient(circle at 15% 20%, rgba(168,85,247,.2), transparent 24rem), radial-gradient(circle at 85% 80%, rgba(217,70,239,.15), transparent 24rem);
        }

        .login-box {
            position: relative;
            width: 410px;
            max-width: 100%;
            background: rgba(18,16,27,.9);
            border: 1px solid var(--line);
            padding: 42px 38px 34px;
            border-radius: 6px;
            box-shadow: 0 25px 80px rgba(0,0,0,.45), 0 0 42px rgba(168,85,247,.12);
        }

        h1 {
            text-align: center;
            color: var(--text);
            margin-bottom: 9px;
            font-size: 31px;
            letter-spacing: -1.5px;
        }

        h1::before { content: '◈'; color: var(--electric); margin-right: 9px; }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 28px;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 13px;
            border: 1px solid var(--line);
            border-radius: 3px;
            background: #0c0a12;
            color: var(--text);
            font: 13px 'Space Grotesk', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 16px rgba(168,85,247,.2);
        }

        input::placeholder { color: #686174; }

        button {
            width: 100%;
            padding: 14px;
            background: var(--violet);
            color: white;
            border: none;
            border-radius: 3px;
            font: 600 13px 'Space Grotesk', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(168,85,247,.3);
        }

        button:hover {
            background: var(--electric);
            box-shadow: 0 0 26px rgba(217,70,239,.45);
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            color: var(--muted);
            font-size: 13px;
        }

        .register-link a {
            color: var(--lime);
            text-decoration: none;
            font-weight: bold;
        }

        .login-box::before, .login-box::after { content: ''; position: absolute; pointer-events: none; border: 1px solid rgba(217,70,239,.5); }
        .login-box::before { width: 90px; height: 90px; border-radius: 50%; top: -45px; right: -45px; box-shadow: 0 0 30px rgba(217,70,239,.3); }
        .login-box::after { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); border: 0; left: 25px; top: 25px; box-shadow: 0 0 15px var(--lime); }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Connect Z</h1>

        <p class="subtitle">Login to your account</p>

        <form action="/login" method="POST">

            <!-- IMPORTANT: name must be username -->
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <!-- IMPORTANT: name must be password -->
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

    </div>

</body>
</html>
